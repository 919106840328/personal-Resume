      <p class="eyebrow">Hometown</p>
      <h1 class="page-title">家乡 · 武汉</h1>
      <article class="card hometown">
        <p>
          「九省通衢地，骑鹤入江城」说的就是武汉：自古交通通达多省，长江穿城而过。
          李白写过「黄鹤楼中吹玉笛，江城五月落梅花」。现在的武汉更是中部交通中心。
        </p>
        <p>
          我最喜欢东湖：造型奇特的石桥、绿油油的大树、平坦的绿道，还有小动物场馆。
          吃的更不必说——汤包、热干面、豆皮。热干面要数蔡林记，清晨门前就排满了人，
          面一出锅，香味好像整条街都能闻到。
        </p>
        <p class="invite">欢迎来武汉玩。</p>
