        <h3>软件工程</h3>
        <p>
          小学第一次接触电脑就觉得新鲜，当时就想学好计算机。高中用办公软件时，
          遇到系统出错、文件丢失，才发现知识是零散的。那是一直放不下的遗憾，
          所以进大学后选择软件工程，把落下的补回来。
        </p>
        <p>
          课上跟着完整流程走：需求、概要与详细设计、编码、测试。希望能做出可修改、
          可靠、可维护的软件，而不只是能跑的作业。
